name: SAHJONY desk (scheduled)

on:
  schedule:
    # 24/7 desk, all hours, every day. Crypto trades round-the-clock; equities
    # simply queue while their market is closed. This cron controls how often a
    # job STARTS (and GitHub throttles it heavily anyway) — the desk's actual
    # cycle rate is CYCLE_MINUTES, applied inside the job.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if the market is closed'
        type: boolean
        default: true
      deploy_hook:
        description: 'Optional Vercel Deploy Hook URL to publish this run'
        type: string
        default: ''

concurrency:
  group: sahjony-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # ── Broker selection ──────────────────────────────────────────────────────
      # Default 'alpaca' (paper) keeps the desk 100% paper. Set repo Variable
      # BROKER=robinhood_crypto to route the LIVE 24/7 crypto engine instead.
      BROKER: ${{ vars.BROKER || 'alpaca' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: 'true'
      # ── Robinhood Crypto (REAL MONEY, official Ed25519 API) ───────────────────
      # HARD-GATED: real orders place ONLY when the adapter is armed — i.e. ALL of
      #   BROKER=robinhood_crypto  +  ROBINHOOD_API_KEY  +  ROBINHOOD_PRIVATE_KEY
      #   +  ROBINHOOD_LIVE=true  +  LIVE_TRADING_ACK=I_UNDERSTAND_REAL_MONEY.
      # Missing any → dry-run (prices live, places nothing). Per-order notional is
      # capped by ROBINHOOD_MAX_ORDER_USD and the risk engine still gates size.
      ROBINHOOD_API_KEY: ${{ secrets.ROBINHOOD_API_KEY }}
      ROBINHOOD_PRIVATE_KEY: ${{ secrets.ROBINHOOD_PRIVATE_KEY }}
      ROBINHOOD_LIVE: ${{ vars.ROBINHOOD_LIVE || 'false' }}
      ROBINHOOD_MAX_ORDER_USD: ${{ vars.ROBINHOOD_MAX_ORDER_USD || '10' }}
      LIVE_TRADING_ACK: ${{ secrets.LIVE_TRADING_ACK }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      AI_BRAIN_ENABLED: ${{ vars.AI_BRAIN_ENABLED || secrets.AI_BRAIN_ENABLED || ((secrets.ANTHROPIC_API_KEY != '' || secrets.NVIDIA_API_KEY != '') && 'true' || 'false') }}
      AUTO_UPDATE_MODELS: 'true'
      # Universe spans asset classes: mega-cap equities, index ETFs, commodities
      # (GLD/SLV), bonds (TLT), international (EEM) and 24/7 crypto. When BROKER=
      # robinhood_crypto, set Variable TICKERS to crypto-only, e.g.
      # 'BTC/USD,ETH/USD,SOL/USD,LTC/USD' (stock symbols can't price on a crypto venue).
      TICKERS: ${{ vars.TICKERS || 'AAPL,MSFT,NVDA,GOOGL,AMZN,TSLA,META,SPY,QQQ,DIA,GLD,SLV,TLT,EEM,BTC/USD,ETH/USD,SOL/USD,LTC/USD' }}
      MARKET_HOURS: ${{ vars.MARKET_HOURS || '24_7' }}
      # 5, not 15. This governs the GAP between cycles inside one job, and the
      # job runs for DESK_LOOP_MINUTES either way — so this buys ~11 cycles per
      # scheduled window instead of ~3 at no extra Actions minutes. It is the
      # binding constraint on two separate things: the evaluation window needs 30
      # closed trades to be significant and had 1 trade in its first 2.65 days,
      # and the bar recorder can only build a 5-minute bar if it sees the market
      # every 5 minutes (config.bar_intervals_for). Costs more broker/LLM calls
      # per hour.
      #
      # Read from CYCLE_MINUTES_OVERRIDE, not CYCLE_MINUTES. The plain variable is
      # set to 15 and was silently winning over the '5' default above, so the
      # change this comment describes has never actually taken effect. The live
      # desk proves it: status.json reports cadence.expected_min 15 and bar
      # intervals (15,60), and bar_intervals_for(5) would have produced (5,15).
      # Consequences were exactly the two this default was raised to fix — 0 closed
      # trades against the evaluation's 30-trade minimum, and a bar recorder at
      # 1.01 ticks/bar (98.9% single-tick, 2 of 181 bars with a measured range),
      # because a 15-minute poll cannot fill a 15-minute candle.
      #
      # Same failure shape as ANTHROPIC_MODEL, and fixed the same way: rename the
      # knob rather than delete it, so the fix does not depend on anyone
      # remembering to clear a stale setting. Set CYCLE_MINUTES_OVERRIDE to
      # redirect deliberately; the old variable no longer applies.
      CYCLE_MINUTES: ${{ vars.CYCLE_MINUTES_OVERRIDE || '5' }}
      MAX_ALLOCATION_PCT: ${{ vars.MAX_ALLOCATION_PCT || '0.12' }}
      MAX_TOTAL_DEPLOYED_PCT: ${{ vars.MAX_TOTAL_DEPLOYED_PCT || '0.70' }}
      # 0.52 -> 0.51. The floor, not the caps or sizing, is what has kept the live
      # desk to 2 trades in 899 cycles: the council's directional calls land at
      # 0.503 (BTC), 0.513 (ETH), 0.513 (XRP) — every one of them under 0.52, some
      # by 0.007. The gate sat marginally above where this council actually scores.
      #
      # 0.51, not 0.50: config.HARD_MIN_CONVICTION is 0.50, and setting the
      # operating floor equal to the absolute floor leaves no margin at all. 0.51
      # admits the two strongest names and keeps the operating gate above the
      # safety gate, which is the point of having both.
      #
      # Read from the _OVERRIDE name for the reason CYCLE_MINUTES and
      # ANTHROPIC_MODEL both had to be renamed: a stale repository Variable
      # silently beating a corrected default is this repo's recurring failure, and
      # a fix that depends on someone clearing a setting is not a fix.
      #
      # This raises trade COUNT, not per-trade risk — caps and order size are
      # untouched. Expect those extra trades to be roughly break-even at best
      # until the council stops reading a DAILY series on a 5-minute cycle
      # (robinhood_crypto.get_history requests CoinGecko interval=daily), because
      # a ~0.51 call is barely better than a coin flip and the round trip costs
      # 60 bps. Grade it with `python -m tools.conviction_calibration --horizon 3`
      # once council_log.price has accumulated, and set this from that evidence.
      MIN_COUNCIL_CONVICTION: ${{ vars.MIN_COUNCIL_CONVICTION_OVERRIDE || '0.51' }}
      MAX_DAILY_DRAWDOWN_PCT: ${{ vars.MAX_DAILY_DRAWDOWN_PCT || '0.10' }}
      DAY_TRADING_ENABLED: ${{ vars.DAY_TRADING_ENABLED || 'true' }}
      LADDER_ENABLE_AVERAGING: ${{ vars.LADDER_ENABLE_AVERAGING || 'true' }}
      COPY_TRADING_ENABLED: ${{ vars.COPY_TRADING_ENABLED || 'false' }}
      COPY_TRADING_SOURCE_URL: ${{ vars.COPY_TRADING_SOURCE_URL || '' }}
      VOICE_ALERTS: ${{ vars.VOICE_ALERTS || 'false' }}
      VOICE_API_KEY: ${{ secrets.VOICE_API_KEY }}
      OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO: ${{ vars.WHATSAPP_TO || secrets.OWNER_PHONE }}
      WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
      SEC_USER_AGENT: 'SAHJONY Capital research contact@sahjonycapital.com'
      BENCHMARK: ${{ vars.BENCHMARK || 'SPY' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      # Pinned to the PRIMARY brain, not read from vars.ANTHROPIC_MODEL. That
      # variable is set to claude-opus-4-8 — the server-side REFUSAL FALLBACK, not
      # the primary — and it was silently winning over this default, so the desk
      # has never run the model it is documented to run. The override knob is
      # renamed rather than deleted: set vars.ANTHROPIC_MODEL_OVERRIDE to point
      # somewhere else deliberately. The stale variable no longer applies.
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL_OVERRIDE || 'claude-fable-5' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
      XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
      TRADING_HALT: ${{ vars.TRADING_HALT || 'false' }}
      VOL_TARGET_ANNUAL: ${{ vars.VOL_TARGET_ANNUAL == '' && '0.20' || vars.VOL_TARGET_ANNUAL }}
      TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL == '' && '0' || vars.TRADING_CAPITAL }}
      FOREX_PAIRS: ${{ vars.FOREX_PAIRS || 'EUR/USD,GBP/USD,USD/JPY,AUD/USD' }}
      DAY_TRADE_SYMBOLS: ${{ vars.DAY_TRADE_SYMBOLS || '' }}
      DAY_TRADE_TARGET_PCT: ${{ vars.DAY_TRADE_TARGET_PCT || '0.015' }}
      DAY_TRADE_STOP_PCT: ${{ vars.DAY_TRADE_STOP_PCT || '0.01' }}
      # Alt-data overlay (QuiverQuant insider + congressional trading). Add repo
      # secret QUIVER_API_KEY to activate; auto-on when present. The desk runs HERE
      # (GitHub Actions), not on Vercel — a Vercel env var can't reach it.
      QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
      # Hermes guardian — background agent (data integrity, Sharpe scorecard,
      # bounded self-calibration). On by default; set Variable HERMES_ENABLED=false to disable.
      HERMES_ENABLED: ${{ vars.HERMES_ENABLED || 'true' }}
      HERMES_GOAL: ${{ vars.HERMES_GOAL || '' }}
      # Credit Spread Desk — defined-risk bull put spreads (max loss known at entry).
      CREDIT_SPREADS_ENABLED: ${{ vars.CREDIT_SPREADS_ENABLED || 'true' }}
      # Advisory Board — 6-agent council (Buffett/Munger/Macro/Growth/Quant + gate).
      ADVISORS_ENABLED: ${{ vars.ADVISORS_ENABLED || 'true' }}
      # Pairs / StatArb desk — market-neutral cointegrated spreads (long/short).
      PAIRS_ENABLED: ${{ vars.PAIRS_ENABLED || 'true' }}
      PAIRS: ${{ vars.PAIRS || 'SPY:QQQ,GLD:SLV' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore desk state
        uses: actions/cache@v4
        with:
          path: |
            state.json
            model_cache.json
            data
            desks
          key: sahjony-state-${{ github.run_id }}
          restore-keys: |
            sahjony-state-

      - name: Refresh copy-trading signals (SEC Form 4 insider buys)
        run: python -m scripts.build_copy_signals || true

      # Paper "trainer" desk — Alpaca crypto, SAME universe as the live bot but
      # more capital + a looser conviction gate, so it explores more setups. It
      # trades zero real money and feeds realized outcomes into public/knowledge.json.
      # Runs BEFORE the live desk so the live desk reads the freshest pool this cycle.
      # Gated: does nothing until Variable PAPER_TRAINER_ENABLED=true. Isolated via
      # SAHJONY_HOME=desks/paper (own state/db/status). Step env overrides job env;
      # BROKER=alpaca + cleared live gates make real-money placement impossible here.
      - name: Run paper trainer cycle (Alpaca crypto — shared-knowledge sandbox)
        if: ${{ vars.PAPER_TRAINER_ENABLED == 'true' }}
        env:
          SAHJONY_HOME: desks/paper
          BROKER: alpaca
          ALPACA_PAPER: 'true'
          LIVE_TRADING_ACK: ''
          ROBINHOOD_LIVE: 'false'
          TICKERS: ${{ vars.PAPER_TICKERS || vars.TICKERS || 'BTC/USD,ETH/USD,SOL/USD,LTC/USD' }}
          TRADING_CAPITAL: ${{ vars.PAPER_TRADING_CAPITAL == '' && '2000' || vars.PAPER_TRADING_CAPITAL }}
          MIN_COUNCIL_CONVICTION: ${{ vars.PAPER_MIN_CONVICTION || '0.40' }}
          KNOWLEDGE_ROLE: alpaca-paper-trainer
          # Alpaca crypto uses the slash form (BTC/USD); BTC-USD 400s there.
          BENCHMARK: ${{ vars.PAPER_BENCHMARK || 'BTC/USD' }}
          # Keep the trainer crypto-focused so its calibration transfers to the live
          # crypto bot — SEC-insider copy signals are equities (off-mission noise here).
          COPY_TRADING_ENABLED: 'false'
        run: python main.py --once --force || true

      # Paper STOCK desk — Alpaca paper (zero real money): the owner's equity
      # universe (SPY/QQQ/VTI/MSFT/NVDA). Robinhood has no official stock API,
      # so stocks run here; the live Robinhood desk below stays crypto-only.
      - name: Run paper stock desk cycle (Alpaca paper — stocks)
        if: ${{ vars.STOCK_DESK_ENABLED != 'false' }}
        env:
          SAHJONY_HOME: desks/stocks
          BROKER: alpaca
          ALPACA_PAPER: 'true'
          LIVE_TRADING_ACK: ''
          ROBINHOOD_LIVE: 'false'
          TICKERS: ${{ vars.STOCK_TICKERS || 'SPY,QQQ,VTI,MSFT,NVDA' }}
          BENCHMARK: SPY
          MARKET_HOURS: us
          PAIRS: SPY:QQQ
          PAIRS_ENABLED: 'true'
          KNOWLEDGE_ROLE: alpaca-paper-stocks
          TRADING_CAPITAL: ${{ vars.STOCK_TRADING_CAPITAL == '' && '2000' || vars.STOCK_TRADING_CAPITAL }}
        run: python main.py --once --force || true

      # The scheduler THROTTLES how often it STARTS a job (observed: ~hourly for a
      # */15 cron, with multi-hour skips) but one job may run for hours. So drive
      # the live desk from INSIDE a single job: a cycle every CYCLE_MINUTES across
      # DESK_LOOP_MINUTES, publishing each snapshot as it goes. That restores true
      # CYCLE_MINUTES risk checks — stops, floors and the breaker re-evaluate on
      # schedule — with no paid infrastructure. Manual dispatch runs one pass.
      - name: Run live desk cycles (loops through the scheduled window)
        env:
          # 55 -> 165. Measured across 30 scheduled runs (58.7 h): the desk was
          # actually LIVE for 26.0 h — 44% coverage — because the job looped for
          # 55 minutes and then the next run took a median 105 minutes to start.
          # The remaining 56% is not idle time, it is BLIND time on a real-money
          # 24/7 crypto desk: no cycle means no stop-loss check, no daily
          # circuit-breaker evaluation and no ladder ratchet. The worst single
          # stretch was 5.2 hours unattended, on 2026-08-06T18:08Z.
          #
          # This is a larger constraint on trade count than the conviction floor
          # ever was — the desk cannot take a setup while it is not running — and
          # CYCLE_MINUTES does nothing for it, since that only governs the gap
          # WITHIN a window.
          #
          # 165 with a 180-minute timeout (GitHub's job ceiling is 6 h, and
          # standard runners are free on a public repository) lifts coverage to
          # roughly 165/215 ~ 77% against the same ~50-minute restart latency.
          # Not higher, because the ceiling here is the deploy budget rather than
          # Actions: see the commit gate below.
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && (vars.DESK_LOOP_MINUTES == '' && '165' || vars.DESK_LOOP_MINUTES) || '0' }}
          # Publish every Nth cycle rather than every cycle. Each snapshot commit
          # triggers a Vercel build on BOTH linked projects, so at a 5-minute
          # cadence a 165-minute window would be 33 commits and 66 builds per run
          # — several hundred a day, which is over a Hobby-tier daily deployment
          # limit and would break the deploy pipeline in exchange for freshness
          # nobody sees. Committing every 3rd cycle publishes every ~15 minutes,
          # the same dashboard freshness this desk had historically, at a LOWER
          # commit rate than today while tripling coverage.
          PUBLISH_EVERY: ${{ vars.DESK_PUBLISH_EVERY || '3' }}
          # Live crypto universe — 5 -> 13 names, for BREADTH rather than a looser
          # gate. Measured on the live desk: of five symbols, the two with a
          # directional view (BTC, ETH) were already held so the ladder was
          # managing rather than entering, and the other three were 'flat' — no
          # direction at all. Lowering the conviction floor further would not
          # touch a flat call; only more names give more chances that something
          # has a view on a given cycle.
          #
          # Costs nothing per position: the cap is 12% OF EQUITY, not equity/N, so
          # each budget stays ~$2.04 regardless of symbol count. 13 x $2.04 =
          # $26.48 against the $34.98 total-deployed cap, so the aggregate fits
          # with room.
          #
          # Every name is in robinhood_crypto._CG_IDS on purpose. An UNMAPPED
          # symbol gets _coingecko_id() == '' -> _coingecko_history() None ->
          # get_history's flat two-point fallback -> a council that is permanently
          # neutral. Adding one would add a symbol that can never produce a
          # directional view, which is precisely the problem being solved.
          # Deliberately left out: USDC/USDT (stablecoins — pegged, no directional
          # signal by construction), MATIC (migrated to POL; both the CoinGecko id
          # and the RH listing are doubtful), DOT (RH listing unconfirmed), SHIB
          # (sub-cent — a $2 clip is ~200k units), AAVE/COMP (thin at $2 clips).
          #
          # _OVERRIDE for the fourth time in this file, same reason as
          # CYCLE_MINUTES, MIN_COUNCIL_CONVICTION and ANTHROPIC_MODEL: a stale
          # repository Variable silently beating a corrected default is this
          # repo's recurring failure, and it is not worth assuming this one is unset.
          TICKERS: ${{ vars.TICKERS_LIVE_OVERRIDE || 'BTC/USD,ETH/USD,SOL/USD,LTC/USD,XRP/USD,DOGE/USD,ADA/USD,AVAX/USD,LINK/USD,BCH/USD,UNI/USD,XLM/USD,ETC/USD' }}
          DAY_TRADE_SYMBOLS: ''
          # Owner directive: 0 = size against the FULL live Robinhood balance
          # (equity curve, sizing and Hermes' scorecard all track the real
          # account and follow deposits automatically). Set Variable
          # LIVE_TRADING_CAPITAL to a number to risk only part of the balance.
          TRADING_CAPITAL: ${{ vars.LIVE_TRADING_CAPITAL == '' && '0' || vars.LIVE_TRADING_CAPITAL }}
        run: |
          set +e
          git config user.name  "sahjony-desk[bot]"
          git config user.email "sahjony-desk[bot]@users.noreply.github.com"
          END=$(( SECONDS + 60 * ${LOOP_MINUTES:-0} ))
          GAP=$(( 60 * ${CYCLE_MINUTES:-5} ))
          n=0
          while : ; do
            n=$(( n + 1 ))
            echo "── live cycle $n (window ${LOOP_MINUTES:-0} min, gap ${GAP}s) ──"
            if ! python main.py --once --force; then
              echo "Live desk cycle failed; refusing to publish a success snapshot."
              exit 1
            fi
            # The paper crypto trainer is evaluation.json's PRIMARY evidence
            # ("enough trade count for statistics") but it ran --once per JOB,
            # so it got ~1 cycle for every 4 the live desk took. Run it here and
            # it collects at the same rate. Zero real money: Alpaca paper, both
            # live locks explicitly blanked, its own SAHJONY_HOME and knowledge
            # role, so it cannot touch live state.
            if [ "${{ vars.PAPER_TRAINER_ENABLED }}" = "true" ] && [ "$n" -gt 1 ]; then
              echo "── paper trainer cycle $n ──"
              SAHJONY_HOME=desks/paper BROKER=alpaca ALPACA_PAPER=true \
              LIVE_TRADING_ACK='' ROBINHOOD_LIVE=false COPY_TRADING_ENABLED=false \
              TICKERS="${{ vars.PAPER_TICKERS || vars.TICKERS || 'BTC/USD,ETH/USD,SOL/USD,LTC/USD' }}" \
              TRADING_CAPITAL="${{ vars.PAPER_TRADING_CAPITAL == '' && '2000' || vars.PAPER_TRADING_CAPITAL }}" \
              MIN_COUNCIL_CONVICTION="${{ vars.PAPER_MIN_CONVICTION || '0.40' }}" \
              KNOWLEDGE_ROLE=alpaca-paper-trainer \
              BENCHMARK="${{ vars.PAPER_BENCHMARK || 'BTC/USD' }}" \
                python main.py --once --force || true
              git add desks/paper/public/status.json 2>/dev/null
            fi
            # Publish each cycle immediately so the dashboard and its freshness
            # indicator track the DESK, not the scheduler.
            # Stage EVERY artifact a cycle rewrites. Staging only two of them
            # left public/ai_shadow.json dirty, and `git pull --rebase` refuses
            # to run with unstaged changes — so every cycle logged
            # "cannot pull with rebase: You have unstaged changes" and the
            # intra-loop push survived only while master had not moved.
            git add public/status.json public/knowledge.json \
                    public/ai_shadow.json public/copy_signals.json 2>/dev/null
            # Publish on every PUBLISH_EVERY-th cycle, and always on the last one
            # so a window never ends with unpublished state. Staging still happens
            # each cycle, so a skipped publish is only deferred, never lost.
            PUB=${PUBLISH_EVERY:-1}
            [ "$PUB" -lt 1 ] 2>/dev/null && PUB=1
            LAST=0
            [ $SECONDS -ge $END ] && LAST=1
            [ $(( END - SECONDS )) -lt $GAP ] && LAST=1
            if [ $(( n % PUB )) -ne 0 ] && [ "$LAST" -eq 0 ]; then
              echo "cycle $n — staged, publishing every ${PUB} cycle(s)"
            elif ! git diff --cached --quiet; then
              git commit -q -m "Desk snapshot: live cycle ${{ github.run_number }}.$n"
              git pull --rebase -q origin master || git rebase --abort
              git push -q origin HEAD:master || echo "push deferred to the final commit step"
            fi
            [ $SECONDS -ge $END ] && break
            [ $(( END - SECONDS )) -lt $GAP ] && break
            sleep $GAP
          done

      # Robinhood crypto desk — DRY-RUN stage: live market data + real account
      # reads via the official Crypto API, but the broker only LOGS the orders it
      # would place until the operator deliberately arms BOTH gates
      # (Variable ROBINHOOD_LIVE=true AND secret LIVE_TRADING_ACK=I_UNDERSTAND_REAL_MONEY).
      # Isolated under SAHJONY_HOME=desks/robinhood (own state/db/status); runs by
      # default once Robinhood secrets exist — disable with ROBINHOOD_DESK_ENABLED=false.
      # ── Alpaca LIVE stock desk (REAL MONEY) ──────────────────────────────────
      # Deliberately isolated from every paper desk and triple-gated: it runs only
      # when Variable ALPACA_LIVE_ENABLED=true AND separate LIVE keys exist AND the
      # LIVE_TRADING_ACK secret is set. It uses ALPACA_LIVE_* secrets — never the
      # paper keys — so a live flag can never be paired with a paper credential
      # (or vice versa) by accident.
      #
      # Day trading is FORCED OFF here: US pattern-day-trader rules restrict
      # accounts under $25k to 3 day trades per 5 business days, and a violation
      # freezes the account. The swing desks (ladder/wheel) are unaffected.
      - name: Run Alpaca LIVE stock desk cycle (REAL MONEY — gated)
        if: ${{ vars.ALPACA_LIVE_ENABLED == 'true' }}
        env:
          SAHJONY_HOME: desks/alpaca-live
          BROKER: alpaca
          ALPACA_PAPER: 'false'
          ALPACA_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          ROBINHOOD_LIVE: 'false'
          TICKERS: ${{ vars.ALPACA_LIVE_TICKERS || 'SPY,QQQ,VTI,MSFT,NVDA' }}
          BENCHMARK: SPY
          MARKET_HOURS: us
          KNOWLEDGE_ROLE: alpaca-live-stocks
          DAY_TRADING_ENABLED: 'false'
          COPY_TRADING_ENABLED: 'false'
          PAIRS_ENABLED: 'false'
          CREDIT_SPREADS_ENABLED: 'false'
          TRADING_CAPITAL: ${{ vars.ALPACA_LIVE_CAPITAL == '' && '0' || vars.ALPACA_LIVE_CAPITAL }}
        run: python main.py --once --force

      # Skipped when the MAIN desk already runs on robinhood_crypto (vars.BROKER),
      # so one account can never be traded by two desks at once.
      - name: Run Robinhood crypto desk cycle (DRY-RUN unless armed)
        if: ${{ vars.ROBINHOOD_DESK_ENABLED != 'false' && vars.BROKER != 'robinhood_crypto' }}
        env:
          SAHJONY_HOME: desks/robinhood
          BROKER: robinhood_crypto
          TICKERS: ${{ vars.ROBINHOOD_TICKERS || 'BTC/USD,ETH/USD,SOL/USD,LTC/USD' }}
          BENCHMARK: BTC/USD
          PAIRS: BTC/USD:ETH/USD
          KNOWLEDGE_ROLE: robinhood-crypto
          COPY_TRADING_ENABLED: 'false'
          TRADING_CAPITAL: ${{ vars.ROBINHOOD_TRADING_CAPITAL == '' && '100' || vars.ROBINHOOD_TRADING_CAPITAL }}
          ROBINHOOD_MAX_ORDER_USD: ${{ vars.ROBINHOOD_MAX_ORDER_USD || '10' }}
        run: python main.py --once --force

      # Surfaces the failure that has now bitten four separate knobs: a stale
      # repository Variable silently beating a corrected default, found each time
      # by accident from a symptom rather than from a signal. Prints which
      # Variables are dead (renamed away, still set, doing nothing) and which are
      # actively overriding a default. Allowlisted to non-sensitive knobs — this
      # repository is public, so its Actions logs are too.
      - name: Effective config (repository Variables vs defaults)
        if: always()
        env:
          DESK_VARS_JSON: >-
            {"CYCLE_MINUTES": "${{ vars.CYCLE_MINUTES }}",
             "MIN_COUNCIL_CONVICTION": "${{ vars.MIN_COUNCIL_CONVICTION }}",
             "TICKERS_LIVE": "${{ vars.TICKERS_LIVE }}",
             "ANTHROPIC_MODEL": "${{ vars.ANTHROPIC_MODEL }}",
             "BROKER": "${{ vars.BROKER }}",
             "TRADING_HALT": "${{ vars.TRADING_HALT }}",
             "ROBINHOOD_LIVE": "${{ vars.ROBINHOOD_LIVE }}",
             "ROBINHOOD_MAX_ORDER_USD": "${{ vars.ROBINHOOD_MAX_ORDER_USD }}",
             "ALPACA_LIVE_ENABLED": "${{ vars.ALPACA_LIVE_ENABLED }}",
             "MAX_ALLOCATION_PCT": "${{ vars.MAX_ALLOCATION_PCT }}",
             "MAX_TOTAL_DEPLOYED_PCT": "${{ vars.MAX_TOTAL_DEPLOYED_PCT }}",
             "MAX_DAILY_DRAWDOWN_PCT": "${{ vars.MAX_DAILY_DRAWDOWN_PCT }}",
             "VOL_TARGET_ANNUAL": "${{ vars.VOL_TARGET_ANNUAL }}",
             "LIVE_TRADING_CAPITAL": "${{ vars.LIVE_TRADING_CAPITAL }}",
             "MARKET_HOURS": "${{ vars.MARKET_HOURS }}",
             "PAPER_TRAINER_ENABLED": "${{ vars.PAPER_TRAINER_ENABLED }}",
             "STOCK_DESK_ENABLED": "${{ vars.STOCK_DESK_ENABLED }}",
             "ROBINHOOD_DESK_ENABLED": "${{ vars.ROBINHOOD_DESK_ENABLED }}",
             "CYCLE_MINUTES_OVERRIDE": "${{ vars.CYCLE_MINUTES_OVERRIDE }}",
             "MIN_COUNCIL_CONVICTION_OVERRIDE": "${{ vars.MIN_COUNCIL_CONVICTION_OVERRIDE }}",
             "TICKERS_LIVE_OVERRIDE": "${{ vars.TICKERS_LIVE_OVERRIDE }}",
             "ANTHROPIC_MODEL_OVERRIDE": "${{ vars.ANTHROPIC_MODEL_OVERRIDE }}"}
        run: python -m scripts.effective_config || true

      - name: Preflight (read-only) summary
        if: always()
        run: python main.py --preflight || true

      - name: Commit refreshed dashboard snapshot
        run: |
          git config user.name  "sahjony-desk[bot]"
          git config user.email "sahjony-desk[bot]@users.noreply.github.com"
          git add public/status.json public/copy_signals.json public/knowledge.json \
                  public/ai_shadow.json 2>/dev/null || true
          git add desks/paper/public/status.json 2>/dev/null || true
          git add desks/robinhood/public/status.json 2>/dev/null || true
          git add desks/stocks/public/status.json 2>/dev/null || true
          git add desks/alpaca-live/public/status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Desk snapshot: cycle ${{ github.run_number }} update"
            for i in 1 2 3 4; do git push && break || sleep $((2**i)); done
          else
            echo "No snapshot changes — nothing to commit."
          fi

      - name: Trigger Vercel production deploy (if hook configured)
        env:
          HOOK: ${{ github.event.inputs.deploy_hook || secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" >/dev/null && echo "Vercel deploy hook fired ✓" || echo "deploy hook call failed"
          else
            echo "VERCEL_DEPLOY_HOOK not set — skipping."
          fi
