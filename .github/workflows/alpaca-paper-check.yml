# Alpaca Paper — READ-ONLY account check (manual trigger only).
#
# Verifies the APCA_API_KEY_ID / APCA_API_SECRET_KEY secrets by running the
# paper runner in --mode account: fetches account info, places NO orders and
# CANNOT place any. The venue adapter hard-refuses every endpoint except
# https://paper-api.alpaca.markets (live is refused at construction AND at
# request time), and --mode account performs only GET requests.
#
# Keys are read from the environment only and are never printed, logged, or
# embedded in error messages or the audit log. The run log prints account
# numbers only (equity / buying power), no keys. Keep the repository private.

name: Alpaca Paper — account check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hft/lab-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read-only account check (no orders, paper only)
        run: python -m hft.paper_run --mode account
