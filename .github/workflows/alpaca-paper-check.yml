# Alpaca Paper — account check + dry-run trade loop (manual trigger only).
#
# --mode account: fetches account info, places NO orders and CANNOT place any.
# --mode trade: runs the signal loop in DRY-RUN ONLY. This workflow never
#   passes --dry-run=false, so the trade mode performs only GET requests
#   (account, positions, bars) and logs intents without submitting anything.
#   Submitting a real paper order requires a separate explicit workflow change
#   and Juan's express approval of the exact order plan.
# The venue adapter hard-refuses every endpoint except
# https://paper-api.alpaca.markets (live is refused at construction AND at
# request time).
#
# Keys are read from the environment only and are never printed, logged, or
# embedded in error messages or the audit log. The run log prints account
# numbers only (equity / buying power), no keys. Keep the repository private.

name: Alpaca Paper — account check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Runner mode: account (read-only) or trade (dry-run, submits nothing)"
        required: true
        default: "account"
        type: choice
        options:
          - account
          - trade
      max_orders:
        description: "Trade mode: max intents per run (default 5)"
        required: false
        default: "5"
      interval:
        description: "Trade mode: seconds between signal polls (default 60)"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hft/lab-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper runner (account = read-only, trade = dry-run, no orders submitted)
        run: python -u -m hft.paper_run --mode ${{ inputs.mode }} --max-orders ${{ inputs.max_orders }} --interval ${{ inputs.interval }}
