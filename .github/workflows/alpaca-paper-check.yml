# Alpaca Paper — account check + dry-run trade loop (manual trigger only).
#
# --mode account: fetches account info, places NO orders and CANNOT place any.
# --mode trade: runs the signal loop in DRY-RUN ONLY. This workflow never
#   passes --dry-run=false, so the trade mode performs only GET requests
#   (account, positions, bars) and logs intents without submitting anything.
#   Submitting a real paper order requires a separate explicit workflow change
#   and Juan's express approval of the exact order plan.
# The venue adapter hard-refuses every endpoint except
# https://paper-api.alpaca.markets (live is refused at construction AND at
# request time).
#
# Keys are read from the environment only and are never printed, logged, or
# embedded in error messages or the audit log. The run log prints account
# numbers only (equity / buying power), no keys. Keep the repository private.

name: Alpaca Paper — account check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Runner mode: account (read-only) or trade (dry-run, submits nothing)"
        required: true
        default: "account"
        type: choice
        options:
          - account
          - trade
      max_orders:
        description: "Trade mode: max intents per run (default 5)"
        required: false
        default: "5"
      interval:
        description: "Trade mode: seconds between signal polls (default 60)"
        required: false
        default: "60"
      max_iterations:
        description: "Trade mode: max signal polls per run; stops even with no signals (empty = unbounded)"
        required: false
        default: ""
      entry_threshold:
        description: "Trade mode: strategy signal threshold (default 0.35; lower = fires on weaker signals)"
        required: false
        default: "0.35"
      allow_submit:
        description: "DANGER: pass --dry-run=false so intents SUBMIT real paper orders (default false = dry-run only)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hft/lab-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper runner (account = read-only, trade = dry-run, no orders submitted)
        run: |
          ARGS="--mode ${{ inputs.mode }} --max-orders ${{ inputs.max_orders }} --interval ${{ inputs.interval }} --entry-threshold ${{ inputs.entry_threshold }}"
          if [ -n "${{ inputs.max_iterations }}" ]; then
            ARGS="$ARGS --max-iterations ${{ inputs.max_iterations }}"
          fi
          if [ "${{ inputs.allow_submit }}" = "true" ]; then
            echo "SUBMIT MODE: passing --dry-run=false; real paper orders will be placed"
            ARGS="$ARGS --dry-run=false"
          fi
          if [ "${{ inputs.mode }}" = "trade" ]; then
            ARGS="$ARGS --summary-path paper_test_summary.json"
          fi
          python -u -m hft.paper_run $ARGS

      - name: Publish dashboard summary
        if: inputs.mode == 'trade'
        run: |
          # Copy the run summary to public/paper_test.json on master so the
          # dashboard-sync workflow mirrors it to gh-pages.
          if [ ! -f paper_test_summary.json ]; then
            echo "no summary file; skipping dashboard publish"
            exit 0
          fi
          # Stamp the GitHub run URL into the summary for the dashboard link.
          python3 -c "
          import json
          p = 'paper_test_summary.json'
          d = json.load(open(p))
          d['run_url'] = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          d['run_id'] = '${{ github.run_id }}'
          json.dump(d, open(p, 'w'), indent=2)
          "
          git config user.name "sahjony-paper-test[bot]"
          git config user.email "sahjony-paper-test[bot]@users.noreply.github.com"
          git fetch origin master -q
          # Publish via a throwaway worktree of master: the main checkout
          # stays on hft/lab-v2 untouched (no stash/checkout dance — an
          # earlier version stashed the untracked summary file away and the
          # subsequent cp failed, breaking the whole step).
          PUBDIR="$(mktemp -d)"
          git worktree add --detach "$PUBDIR" origin/master -q
          mkdir -p "$PUBDIR/public"
          cp paper_test_summary.json "$PUBDIR/public/paper_test.json"
          cd "$PUBDIR"
          git add public/paper_test.json
          if git diff --cached --quiet; then
            echo "no summary changes"
          else
            git commit -q -m "Paper test summary: run ${{ github.run_id }}"
            git push -q origin HEAD:master
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$PUBDIR"
