name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json is intentionally gitignored (Node deps are local-only), so
      # Node linting only runs if one is ever committed — otherwise skip cleanly
      # instead of failing every run (and blocking the deploy job downstream).
      - name: Detect Node project
        id: node
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: No Node project — skipping lint
        if: steps.node.outputs.present == 'false'
        run: echo "No package.json committed (gitignored by design) — nothing to lint."

      - uses: actions/setup-node@v4
        if: steps.node.outputs.present == 'true'
        with:
          node-version: 20

      # These steps only apply if the repo grows an npm project (package.json).
      # Without one, `npm install` / `npm run lint` fail every push — guard them.
      - name: Install dependencies
        if: steps.node.outputs.present == 'true'
        run: npm install

      - name: Type check
        if: steps.node.outputs.present == 'true'
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "no tsconfig.json — skipping"; fi

      - name: Lint
        if: steps.node.outputs.present == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint?0:1)"; then
            npm run lint
          else
            echo "no lint script — skipping"
          fi

  tests:
    name: Test Suites (Python + Dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax gate
        run: python -m py_compile $(git ls-files '*.py')

      # The WHOLE suite, not a hand-maintained subset. This used to name ~18 of
      # the 65 test modules explicitly, which left the safety-critical ones —
      # test_risk_fail_closed, test_execution_governance, test_position_audit,
      # test_reconciliation, test_remediate_positions, test_transaction_costs —
      # green in the repo but never actually executed by CI.
      - name: Python test suite
        run: python -m pytest tests/ -q

      # Audits every desk's books against the risk invariants. NON-BLOCKING for
      # now: desks/paper and desks/stocks currently carry 10 open findings
      # (both insolvent, a short recorded as long, unpriceable crypto rows in
      # equity desks), so making this a hard gate today would fail every run and
      # — with the deploy job now correctly gated on tests — block the dashboard
      # deploy for reasons that have nothing to do with the dashboard.
      # FLIP continue-on-error TO false once `python -m tools.position_audit`
      # exits 0 locally. That is the point of the tool.
      - name: Position audit (advisory until desks are remediated)
        continue-on-error: true
        run: python -m tools.position_audit

      # Does the LIVE site actually serve what master says? "CI green" and
      # "deployment READY" were both true for two days while production sat 82
      # cycles behind, because master pushes were landing as Vercel PREVIEWS
      # (Production Branch was not 'master') and only a manual promote went live.
      # Nothing watched the one number that would have shown it. Advisory while
      # that setting is still wrong; it goes green on its own once master
      # deploys to production, and can be made blocking after that.
      - name: Production freshness (is the deployed dashboard current?)
        continue-on-error: true
        run: python -m scripts.check_production_freshness

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dashboard UI test (jsdom)
        run: |
          npm install --no-save jsdom@24
          node tests/ui_test.js

  trading-bot:
    name: Trading Bot (Python)
    runs-on: ubuntu-latest
    env:
      APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      APCA_API_BASE_URL:   ${{ secrets.APCA_API_BASE_URL }}
      ALPACA_API_KEY:      ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY:   ${{ secrets.ALPACA_SECRET_KEY }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      NVIDIA_API_KEY:      ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL:        ${{ secrets.NVIDIA_MODEL }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
      AI_BRAIN_ENABLED:    ${{ secrets.AI_BRAIN_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Syntax gate
        run: python -m py_compile $(git ls-files '*.py')

      - name: Offline test suite (zero real orders)
        # Hermetic: blank the job-level secrets for this step so the suite runs
        # credential-less (the tests assert offline-sim = zero real orders).
        env:
          ALPACA_API_KEY: ""
          ALPACA_SECRET_KEY: ""
          APCA_API_KEY_ID: ""
          APCA_API_SECRET_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          NVIDIA_API_KEY: ""
          GEMINI_API_KEY: ""
          XAI_API_KEY: ""
          AI_BRAIN_ENABLED: "false"
        run: |
          python -m tests.test_dry_run
          python -m tests.test_broker_factory
          python -m tests.test_broker_conformance
          python -m tests.test_robinhood_safety
          python -m tests.test_remote_control
          python -m tests.test_controls

      - name: Verify Alpaca credentials are wired
        run: |
          python - <<'EOF'
          import os, sys
          key    = os.getenv("APCA_API_KEY_ID") or os.getenv("ALPACA_API_KEY")
          secret = os.getenv("APCA_API_SECRET_KEY") or os.getenv("ALPACA_SECRET_KEY")
          base   = os.getenv("APCA_API_BASE_URL", "https://broker-api.sandbox.alpaca.markets")
          if not key or not secret:
              print("ERROR: Alpaca credentials not found in environment")
              sys.exit(1)
          mode = "SANDBOX" if "sandbox" in base else "PRODUCTION"
          print(f"Alpaca credentials present — mode: {mode}")
          EOF

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Gated on `tests`, not just `lint-typecheck`. lint-typecheck skips every one
    # of its steps when package.json is absent — which it always is, by design —
    # so it was a guaranteed pass, and production deployed on every push to master
    # whether or not a single Python test had run.
    needs: [lint-typecheck, tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Vercel deployment
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -o /dev/null -w "Vercel hook status: %{http_code}\n"
