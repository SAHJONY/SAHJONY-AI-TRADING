name: Dashboard integrity

on:
  pull_request:
    paths:
      - public/index.html
      - scripts/build_public_config.sh
      - .github/workflows/dashboard-integrity.yml
  push:
    branches:
      - master
    paths:
      - public/index.html
      - scripts/build_public_config.sh
      - .github/workflows/dashboard-integrity.yml

permissions:
  contents: read

jobs:
  verify-canonical-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify canonical f51362f dashboard
        shell: bash
        run: |
          set -euo pipefail
          expected="d08f2f892c5486e58fbdd264fbecb60a75ee73c8"
          test -f public/index.html
          actual="$(git hash-object public/index.html)"
          test "$actual" = "$expected"
