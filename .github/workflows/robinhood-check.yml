# Robinhood Crypto — READ-ONLY auth check (manual trigger only).
#
# Verifies the ROBINHOOD_API_KEY / ROBINHOOD_PRIVATE_KEY secrets by fetching
# the account summary and a BTC-USD quote. Places NO orders and CANNOT place
# any: the live gates (LIVE_TRADING_ACK, ROBINHOOD_LIVE) are deliberately not
# set here, and the check script itself only performs GET requests.
#
# Note: the run log prints your crypto buying power / equity (numbers only,
# no keys). Keep the repository private.

name: Robinhood Crypto — auth check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROBINHOOD_API_KEY: ${{ secrets.ROBINHOOD_API_KEY }}
      ROBINHOOD_PRIVATE_KEY: ${{ secrets.ROBINHOOD_PRIVATE_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read-only auth check (no orders, no money moved)
        run: python -m scripts.robinhood_check
